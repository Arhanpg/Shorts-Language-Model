[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shorts-language-model"
version = "0.1.0"
description = "Rights-aware multimodal short-form video understanding and performance research"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Shorts Language Model contributors" }]
dependencies = [
  "pydantic>=2.7,<3",
  "typer>=0.12,<1",
  "rich>=13.7,<15",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
media = ["opencv-python>=4.9", "scenedetect[opencv]>=0.6", "Pillow>=10"]
audio = ["librosa>=0.10", "faster-whisper>=1.0"]
ocr = ["paddleocr>=2.7"]
ml = ["torch>=2.3", "transformers>=4.45", "datasets>=2.20", "peft>=0.12", "accelerate>=0.34"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "types-PyYAML>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
