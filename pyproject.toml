[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shorts-language-model"
version = "0.2.0"
description = "Rights-aware multimodal short-form video telemetry and understanding"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Shorts Language Model contributors" }]
dependencies = [
  "pydantic>=2.7,<3",
  "typer>=0.12,<1",
  "rich>=13.7,<15",
  "numpy>=1.26,<3",
  "opencv-python>=4.9,<5",
]

[project.optional-dependencies]
audio = ["librosa>=0.10,<1", "faster-whisper>=1.0,<2"]
ocr = ["paddleocr>=2.7,<4"]
discovery = ["yt-dlp>=2024.10", "instaloader>=4.14.3", "ddgs>=9"]
instagram-fallback = ["gallery-dl>=1.32"]
vidtrace = [
  "vidtrace[whisper,ocr] @ git+https://github.com/Arhanpg/VidTrace.git@910c6d2add21079c0d26316b1b7a2862a8db50e9",
]
all = ["librosa>=0.10,<1", "faster-whisper>=1.0,<2", "paddleocr>=2.7,<4", "yt-dlp>=2024.10", "instaloader>=4.14.3", "ddgs>=9"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
shorts-lm = "shorts_intelligence.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
